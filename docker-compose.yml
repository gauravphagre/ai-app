services:

  ollama:
    build: ./ollama
    image: ai-ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ai-net

  backend:
    build: ./backend
    image: ai-backend
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - ai-net

  frontend:
    build: ./frontend
    image: ai-frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-net

  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    volumes:
      - ./security/trivy/reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
      - ./security/scan.sh:/scan.sh
    entrypoint: [ "/bin/sh", "/scan.sh" ]
    networks:
      - ai-net

  security-exporter:
    build:
      context: ./security
    container_name: security-exporter
    volumes:
      - ./security/trivy/reports:/reports
    ports:
      - "9110:9110"
    networks:
      - ai-net

networks:
  ai-net:
    external: true

